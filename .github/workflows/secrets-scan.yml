name: Secrets Scan

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main, master]

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
      
      - name: Block on detection
        if: failure()
        run: |
          echo "::error::🚨 Secrets detected in commit. This PR cannot be merged."
          echo "::error::Rotate any exposed credentials immediately."
          echo "::error::See the gitleaks output above for specific locations."
          exit 1
